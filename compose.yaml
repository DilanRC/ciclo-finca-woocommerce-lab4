services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${LAB4_DB_NAME:?Defina LAB4_DB_NAME en .env}
      MARIADB_USER: ${LAB4_DB_USER:?Defina LAB4_DB_USER en .env}
      MARIADB_PASSWORD: ${LAB4_DB_PASSWORD:?Defina una clave local en .env}
      MARIADB_ROOT_PASSWORD: ${LAB4_DB_ROOT_PASSWORD:?Defina otra clave local en .env}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  wordpress:
    image: wordpress:7.1.3-php8.3-apache
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LAB4_HTTP_PORT:-8094}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${LAB4_DB_NAME}
      WORDPRESS_DB_USER: ${LAB4_DB_USER}
      WORDPRESS_DB_PASSWORD: ${LAB4_DB_PASSWORD}
    volumes:
      - wpdata:/var/www/html
      - ./theme/ciclo-finca:/var/www/html/wp-content/themes/ciclo-finca:ro
    depends_on:
      db:
        condition: service_healthy

  cli:
    image: wordpress:cli-php8.3
    profiles: ["tools"]
    user: "33:33"
    environment:
      WP_CLI_CACHE_DIR: /tmp/wp-cli/cache
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${LAB4_DB_NAME}
      WORDPRESS_DB_USER: ${LAB4_DB_USER}
      WORDPRESS_DB_PASSWORD: ${LAB4_DB_PASSWORD}
    volumes:
      - wpdata:/var/www/html
      - ./scripts:/lab:ro
      - ./assets/products:/product-assets:ro
      - ./assets/site:/site-assets:ro
      - ./theme/ciclo-finca:/var/www/html/wp-content/themes/ciclo-finca:ro
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started

volumes:
  dbdata:
  wpdata:
